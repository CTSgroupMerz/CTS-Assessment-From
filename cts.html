<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merz Aesthetics · CTS Holistic Evaluation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  --navy:#16365C; --teal:#2E7D8C; --teal-lt:#D6EEF2;
  --red:#C0504D; --red-lt:#FCEAE9;
  --green:#2E9E5B; --green-lt:#E6F7ED;
  --amber:#D4890A; --amber-lt:#FFF3DC;
  --purple:#7B3FA8; --purple-lt:#F3E9FB;
  --gold:#FFE9A8; --sky:#4A90D9; --sky-lt:#EAF3FC;
  --gray1:#F8FAFB; --gray2:#EEF2F6; --gray3:#C8D3DC;
  --gray4:#8A9BAA; --gray5:#4A5568; --white:#FFFFFF;
  --radius:12px; --radius-sm:8px;
  --shadow:0 2px 12px rgba(22,54,92,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--gray1);color:var(--gray5);min-height:100vh;-webkit-font-smoothing:antialiased}
@media print{body{background:white}}

/* HERO */
.hero-merz-logo{height:36px;width:auto;filter:brightness(0) invert(1);margin-bottom:2px}
.hero{background:linear-gradient(135deg,var(--navy) 0%,#1e4d7a 60%,#2E7D8C 100%);padding:28px 20px 20px;text-align:center;position:relative;overflow:hidden}
.hero-logo{font-size:12px;color:rgba(255,255,255,.6);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.hero-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(18px,5vw,26px);font-weight:700;color:white;letter-spacing:-.02em}
.hero-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px}

/* TABS */
.tab-bar{display:flex;background:var(--navy);border-bottom:1px solid rgba(255,255,255,.1);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:50}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:140px;padding:13px 16px;font-size:13px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:rgba(255,255,255,.5);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.tab-btn.active{color:white;border-bottom-color:var(--gold);background:rgba(255,255,255,.05)}

/* FORM */
.form-panel{display:none;max-width:860px;margin:0 auto;padding:20px 16px 60px}
.form-panel.active{display:block}

/* SECTIONS */
.section{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.section-hdr{display:flex;align-items:center;gap:10px;padding:14px 18px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:white}
.section-hdr.navy{background:var(--navy)}.section-hdr.teal{background:var(--teal)}.section-hdr.red{background:var(--red)}.section-hdr.green{background:var(--green)}.section-hdr.sky{background:var(--sky)}
.section-body{padding:16px 18px}

/* FIELDS */
.field-grid{display:grid;gap:12px}
.field-grid.cols2{grid-template-columns:1fr 1fr}
@media(max-width:540px){.field-grid.cols2{grid-template-columns:1fr}}
.field-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gray4);margin-bottom:5px}
.field-input,.field-select,.field-textarea{width:100%;padding:10px 13px;background:var(--gray2);border:1.5px solid transparent;border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--gray5);transition:all .2s;outline:none}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--sky);background:white;box-shadow:0 0 0 3px rgba(74,144,217,.15)}
.field-textarea{min-height:72px;resize:vertical}

/* PILLS */
.pill-group{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 16px;border-radius:50px;cursor:pointer;font-size:13px;font-weight:600;border:2px solid var(--gray3);background:var(--gray2);color:var(--gray4);transition:all .2s;user-select:none}
.pill.active-std{border-color:var(--teal);background:var(--teal);color:white}
.pill.active-adv{border-color:var(--purple);background:var(--purple);color:white}
.pill.active-n{border-color:var(--teal);background:var(--teal-lt);color:var(--teal)}
.pill.active-c{border-color:var(--red);background:var(--red-lt);color:var(--red)}
.pill.active-nc{border-color:var(--navy);background:var(--navy);color:white}

/* ITEMS */
.part-note{font-size:11.5px;color:var(--gray4);padding:10px 14px;background:var(--gray1);border-radius:var(--radius-sm);margin-bottom:12px;border-left:3px solid var(--sky)}
.part-note.red-note{border-left-color:var(--red);color:var(--red);background:var(--red-lt);font-weight:600}
.sub-hdr{padding:9px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;color:white;display:flex;align-items:center;gap:8px}
.sub-hdr.r{background:var(--red)}.sub-hdr.t{background:var(--teal)}.sub-hdr.g{background:var(--green)}
.item-card{border:1.5px solid var(--gray2);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.item-card:hover{box-shadow:0 2px 8px rgba(22,54,92,.08)}
.item-card.adv{border-color:var(--purple-lt);background:var(--purple-lt)}
.item-top{display:grid;grid-template-columns:44px 1fr;background:var(--gray1)}
.item-num{display:flex;align-items:center;justify-content:center;background:var(--teal);color:white;font-size:11px;font-weight:700;font-family:'Space Grotesk',sans-serif;padding:12px 6px;min-height:52px}
.item-num.r{background:var(--red)}.item-num.p{background:var(--purple)}.item-num.g{background:var(--green)}
.item-desc{padding:10px 13px}
.item-title{font-size:13px;font-weight:600;color:var(--navy);line-height:1.4}
.item-sub{font-size:11px;color:var(--gray4);margin-top:2px;line-height:1.4}
.item-crit{font-size:11px;margin-top:5px;font-style:italic}
.item-crit.t{color:var(--teal)}.item-crit.r{color:var(--red)}.item-crit.p{color:var(--purple)}.item-crit.g{color:var(--green)}
.item-bottom{padding:10px 13px;background:white;display:flex;flex-direction:column;gap:8px}

/* PFGE */
.pfge-row{display:flex;gap:6px;flex-wrap:wrap}
.pfge-btn{flex:1;min-width:58px;padding:8px 4px;text-align:center;font-size:12px;font-weight:600;border:2px solid var(--gray3);border-radius:8px;cursor:pointer;background:var(--gray1);color:var(--gray4);transition:all .2s;user-select:none}
.pfge-btn.sp{border-color:var(--red);background:var(--red-lt);color:var(--red)}
.pfge-btn.sf{border-color:var(--amber);background:var(--amber-lt);color:var(--amber)}
.pfge-btn.sg{border-color:var(--teal);background:var(--teal-lt);color:var(--teal)}
.pfge-btn.se{border-color:var(--green);background:var(--green-lt);color:var(--green)}

/* 0-10 */
.score-row{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.score-row::-webkit-scrollbar{display:none}
.score-btn{flex:0 0 auto;width:36px;height:36px;border:2px solid var(--gray3);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;background:var(--gray1);color:var(--gray4);transition:all .15s;display:flex;align-items:center;justify-content:center}
.score-btn.sel{background:var(--red);border-color:var(--red);color:white;transform:scale(1.08);box-shadow:0 2px 6px rgba(192,80,77,.35)}
.comment-input{width:100%;padding:8px 12px;border:1.5px solid var(--gray2);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;color:var(--gray5);background:var(--gray1);resize:none;min-height:48px;outline:none;transition:border-color .2s}
.comment-input:focus{border-color:var(--sky);background:white}

/* SCORE BARS */
.score-card{border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.score-card.tk{background:var(--sky-lt);border:1.5px solid var(--sky)}
.score-card.rk{background:var(--red-lt);border:1.5px solid var(--red)}
.score-card.gk{background:var(--green-lt);border:1.5px solid var(--green)}
.score-card-label{font-size:12px;font-weight:600;flex:1;color:var(--navy)}
.score-card-val{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--navy);min-width:80px;text-align:right}
.score-card-pct{font-size:11px;color:var(--gray4)}
.badge{padding:4px 10px;border-radius:50px;font-size:11px;font-weight:700;white-space:nowrap}
.bp{background:var(--green-lt);color:var(--green)}
.bc{background:var(--amber-lt);color:var(--amber)}
.bf{background:var(--red-lt);color:var(--red)}
.bn{background:var(--gray2);color:var(--gray4)}
.prog-wrap{flex:1}
.prog-bar{height:6px;background:var(--gray2);border-radius:99px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:99px;transition:width .5s ease}

/* RESULT */
.result-card{border-radius:var(--radius);padding:24px 20px;text-align:center;margin:16px 0}
.result-card.pass{background:linear-gradient(135deg,var(--green) 0%,#1e8049 100%)}
.result-card.cond{background:linear-gradient(135deg,var(--amber) 0%,#b8740a 100%)}
.result-card.fail{background:linear-gradient(135deg,var(--red) 0%,#9c3d3a 100%)}
.result-card.none{background:var(--gray2)}
.r-icon{font-size:40px;margin-bottom:8px}
.r-label{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:white}
.r-desc{font-size:13px;color:rgba(255,255,255,.75);margin-top:6px}
.result-card.none .r-label,.result-card.none .r-desc{color:var(--gray4)}

/* ADVANCE BANNER */
.adv-banner{background:var(--purple);color:white;border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px}

/* OVERRIDE */
.override-sel{width:100%;padding:11px 14px;border:2px solid var(--gray3);border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;outline:none;background:var(--gray1);color:var(--gray5);transition:all .2s}
.override-sel:focus{border-color:var(--sky);background:white}

/* ACTION BAR */
.action-bar{position:sticky;bottom:0;background:var(--white);border-top:1px solid var(--gray2);padding:14px 16px;display:flex;gap:10px;z-index:40;box-shadow:0 -4px 20px rgba(22,54,92,.08)}
.btn{flex:1;padding:13px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;font-family:'Space Grotesk',sans-serif;border:none;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-p{background:var(--red);color:white}.btn-p:hover{background:#9c3d3a}
.btn-j{background:var(--teal);color:white}.btn-j:hover{background:#236b79}
.btn-c{background:var(--gray2);color:var(--gray5)}.btn-c:hover{background:var(--gray3)}

/* SIG */
.sig-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.sig-row{grid-template-columns:1fr}}
.sig-box{border:1.5px solid var(--gray3);border-radius:var(--radius-sm);padding:12px;min-height:70px;text-align:center;font-size:11px;color:var(--gray4);display:flex;align-items:flex-end;justify-content:center;background:var(--gray1)}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:white;padding:10px 20px;border-radius:50px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


/* ── STORAGE SYSTEM ──────────────────────────────────── */
.storage-panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;max-width:860px;margin-left:auto;margin-right:auto}
.storage-panel .sp-hdr{background:var(--navy);color:white;padding:13px 18px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none}
.storage-panel .sp-hdr .sp-toggle{font-size:16px;transition:transform .25s}
.storage-panel.collapsed .sp-body{display:none}
.storage-panel.collapsed .sp-toggle{transform:rotate(-90deg)}
.sp-body{padding:14px 18px}
.search-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search-input{flex:1;min-width:160px;padding:9px 13px;background:var(--gray2);border:1.5px solid transparent;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--gray5);outline:none;transition:all .2s}
.search-input:focus{border-color:var(--sky);background:white;box-shadow:0 0 0 3px rgba(74,144,217,.12)}
.btn-save-rec{padding:9px 16px;background:var(--navy);color:white;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-save-rec:hover{background:#1e4d7a}
.records-list{max-height:320px;overflow-y:auto;border:1.5px solid var(--gray2);border-radius:var(--radius-sm)}
.record-item{padding:11px 14px;border-bottom:1px solid var(--gray2);cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:10px}
.record-item:last-child{border-bottom:none}
.record-item:hover{background:var(--sky-lt)}
.record-item.active-rec{background:var(--sky-lt);border-left:3px solid var(--sky)}
.rec-clinic{font-size:12px;font-weight:700;color:var(--navy)}
.rec-trainee{font-size:13px;font-weight:600;color:var(--gray5);flex:1}
.rec-meta{font-size:10px;color:var(--gray4);white-space:nowrap}
.rec-form-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:50px;background:var(--teal-lt);color:var(--teal)}
.rec-form-badge.tox{background:var(--purple-lt);color:var(--purple)}
.rec-del{width:26px;height:26px;border-radius:50%;border:none;background:var(--red-lt);color:var(--red);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.rec-del:hover{background:var(--red);color:white}
.empty-state{padding:28px;text-align:center;color:var(--gray4);font-size:13px}
.sp-filter-pills{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.sp-fpill{padding:5px 12px;border-radius:50px;font-size:11px;font-weight:600;border:1.5px solid var(--gray3);background:var(--gray2);color:var(--gray4);cursor:pointer;transition:all .15s}
.sp-fpill.on{border-color:var(--sky);background:var(--sky-lt);color:var(--sky)}
.rec-count{font-size:11px;font-weight:400;color:rgba(255,255,255,.6);margin-left:4px}
@media print{.storage-panel{display:none!important}}
/* ═══ PAGE SYSTEM ═══════════════════════════════════════ */
.page { display:none }
.page.active { display:block }

/* ═══ FORM TOP BAR ══════════════════════════════════════ */
.form-topbar{display:flex;align-items:center;justify-content:space-between;background:var(--navy);padding:11px 16px;gap:10px;position:sticky;top:0;z-index:51}
.back-btn{background:rgba(255,255,255,.12);color:white;border:none;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:background .2s;white-space:nowrap}
.back-btn:hover{background:rgba(255,255,255,.22)}
.form-topbar-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;color:white;text-align:center;flex:1}

/* ═══ DASHBOARD ══════════════════════════════════════════ */
.dashboard-wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px}
.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:16px 14px;box-shadow:var(--shadow);text-align:center}
.stat-num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:var(--navy)}
.stat-label{font-size:11px;color:var(--gray4);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.dash-section-label{font-size:12px;font-weight:700;color:var(--gray4);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;padding-left:2px}
.dash-new-section{margin-bottom:22px}
.dash-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.dash-btn-row{grid-template-columns:1fr}}
.dash-new-btn{border:none;border-radius:var(--radius);padding:20px 16px;cursor:pointer;text-align:center;transition:all .2s;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px}
.dash-new-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(22,54,92,.18)}
.filler-btn{background:linear-gradient(135deg,#1e4d7a 0%,var(--teal) 100%)}
.toxin-btn{background:linear-gradient(135deg,var(--purple) 0%,#9c3d3a 100%)}
.dash-new-icon{font-size:32px;margin-bottom:2px}
.dash-new-label{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:white}
.dash-new-sub{font-size:11px;color:rgba(255,255,255,.65)}
.dash-records-section{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
@media print{.form-topbar,.page-dashboard,.dash-stats,.dash-new-section,.dash-records-section{display:none!important}}


/* ═══════════════════════════════════════════════════════
   SUMMARY CARD — 1-page export overlay
═══════════════════════════════════════════════════════ */
.summary-overlay{
  display:none;position:fixed;inset:0;background:rgba(10,20,40,.72);
  z-index:9999;overflow-y:auto;padding:20px 16px;
  backdrop-filter:blur(4px);
}
.summary-overlay.open{display:flex;align-items:flex-start;justify-content:center}

.summary-card{
  background:white;width:100%;max-width:680px;
  border-radius:16px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  font-family:'Inter',system-ui,sans-serif;
  position:relative;
}

/* Header */
.sc-header{
  background:linear-gradient(135deg,#16365C 0%,#1e4d7a 55%,#2E7D8C 100%);
  padding:22px 24px 18px;display:flex;align-items:flex-start;gap:16px;
}
.sc-logo-wrap{flex-shrink:0}
.sc-logo{height:22px;filter:brightness(0) invert(1);display:block}
.sc-header-info{flex:1;min-width:0}
.sc-form-tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.55);margin-bottom:4px}
.sc-trainee{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;
  color:white;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-meta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sc-meta-item{font-size:11px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:4px}
.sc-date-badge{
  background:rgba(255,233,168,.18);border:1px solid rgba(255,233,168,.4);
  color:#FFE9A8;font-size:10px;font-weight:700;padding:3px 9px;border-radius:50px;
  white-space:nowrap;align-self:flex-start;margin-top:2px;letter-spacing:.04em;
}

/* Level + Tech pills */
.sc-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sc-pill{
  font-size:10px;font-weight:700;padding:3px 10px;border-radius:50px;letter-spacing:.04em;
}
.sc-pill.lvl-std{background:rgba(46,125,140,.35);color:#7ECFDA;border:1px solid rgba(46,125,140,.5)}
.sc-pill.lvl-adv{background:rgba(123,63,168,.35);color:#CF9EF0;border:1px solid rgba(123,63,168,.5)}
.sc-pill.tch{background:rgba(255,255,255,.12);color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.2)}

/* Body */
.sc-body{padding:20px 24px}

/* Part rows */
.sc-parts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.sc-part-row{
  border-radius:10px;overflow:hidden;
  border:1.5px solid var(--gray2);
}
.sc-part-top{
  display:flex;align-items:center;gap:0;
}
.sc-part-label{
  padding:12px 14px;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:white;min-width:44px;text-align:center;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sc-part-label.teal{background:var(--teal)}
.sc-part-label.red{background:var(--red)}
.sc-part-label.green{background:var(--green)}

.sc-part-content{flex:1;padding:10px 14px}
.sc-part-title{font-size:12px;font-weight:600;color:var(--navy);margin-bottom:6px}
.sc-part-subtitle{font-size:10px;color:var(--gray4);margin-bottom:-2px}
.sc-prog-row{display:flex;align-items:center;gap:10px}
.sc-prog-track{flex:1;height:8px;background:var(--gray2);border-radius:99px;overflow:hidden}

  calc();
}

function setVisit(v){ S.visit = v; paintVisit(); calc(); }
function paintVisit(){
  document.querySelectorAll('#visit-pills .pill').forEach(p=>p.classList.toggle('active-v', +p.dataset.v===S.visit));
  document.getElementById('form-topbar-title').textContent = 'CTS Holistic Evaluation · Visit '+S.visit;
}
function setConduct(code, v){
  S.cd[code] = (S.cd[code]===v) ? undefined : v;
  paintRow('r_'+code, S.cd[code]); calc();
}
function setScore(code, v){
  const val = v==='N/A' ? 'N/A' : +v;
  S.sc[code] = (S.sc[code]===val) ? undefined : val;
  paintRow('r_'+sid(code), S.sc[code]); calc();
}
function paintRow(rowId, val){
  const row = document.getElementById(rowId); if(!row) return;
  row.querySelectorAll('.pfge-btn').forEach(b=>{
    b.classList.remove('sp','sf','sg','se','sn');
    const d = b.dataset.v;
    if (val===undefined || String(val)!==d) return;
    b.classList.add(d==='1'||d==='No'?'sp':d==='2'?'sf':d==='3'?'sg':d==='4'||d==='Yes'?'se':'sn');
  });
}
const fv = id => { const el=document.getElementById(id); return el ? el.value : ''; };

// ══════════════════════════════════════════════════════════════════════
// CALCULATION — mirrors the Excel formulas exactly
// ══════════════════════════════════════════════════════════════════════
function band(p){ return p>=0.9 ? 'PASS' : p>=0.75 ? 'AWARE / CONDITIONAL' : 'FAIL'; }

function compute(st, getText){
  const aw = AWARE_MAX[st.visit];
  // Section A
  const cdVals = CONDUCT.map(c=>st.cd[c.code]);
  const cdBlank = cdVals.filter(v=>!v).length;
  const noCount = cdVals.filter(v=>v==='No').length;
  const yesCount = cdVals.filter(v=>v==='Yes').length;
  const naCount = cdVals.filter(v=>v==='N/A').length;
  const aRes = cdBlank>0 ? 'รอกรอก' : noCount===0 ? 'PASS' : noCount<=aw ? 'AWARE / CONDITIONAL' : 'FAIL';
  const missCd = CONDUCT.filter(c=>st.cd[c.code]==='No' && !getText('cd_'+c.code).trim()).length;
  // Phases
  const phases = PHASES.map((p,pi)=>{
    let appW=0, pts=0, blank=0;
    const rows = p.items.map(it=>{
      const s = st.sc[it.code];
      const num = typeof s==='number';
      if (s===undefined) blank++;
      if (num){ appW+=it.w; pts+=s/4*it.w; }
      return { it, s, num, wpts: num ? s/4*it.w*p.w : null };
    });
    const pct = appW>0 ? pts/appW : 0;
    const contrib = pct*p.w;
    const res = blank>0 ? 'รอกรอก' : band(pct);
    return { p, pi, rows, pct, contrib, blank, res };
  });
  const overall = phases.reduce((a,x)=>a+x.contrib,0);
  // Critical
  const critVals = CRIT_ITEMS.map(i=>st.sc[i.code]);
  const critScored = critVals.filter(v=>typeof v==='number');
  const minCrit = critScored.length ? Math.min(...critScored) : null;
  const critRes = critScored.length<CRIT_ITEMS.length ? 'รอกรอก' : minCrit>=3 ? 'PASS' : minCrit===2 ? 'AWARE / CONDITIONAL' : 'FAIL';
  // Completeness
  const blanks = cdBlank + phases.reduce((a,x)=>a+x.blank,0);
  const missEv = ALL_ITEMS.filter(i=>typeof st.sc[i.code]==='number' && st.sc[i.code]<=2 && !getText('ev_'+sid(i.code)).trim()).length;
  const complete = blanks>0 ? `INCOMPLETE — ยังไม่ได้กรอก ${blanks} ข้อ` : (missEv+missCd)>0 ? `INCOMPLETE — ขาด evidence ${missEv+missCd} ข้อ` : 'COMPLETE';
  const isInc = complete.startsWith('INCOMPLETE');
  // Parts
  const aRule = aw===0 ? 'PASS = Yes ทุกข้อ | FAIL = มี No แม้ 1 ข้อ'
              : `PASS = Yes ทุกข้อ | AWARE = No ${aw===1?'1':'1–'+aw} ข้อ | FAIL = No ≥${aw+1} ข้อ`;
  const parts = [
    { key:'A', name:'Section A: Conduct', color:'purple', rule:`Visit ${st.visit}: ${aRule}`, val:`${yesCount}/${CONDUCT.length-naCount} Yes`, res:aRes,
      fail:`Section A: Conduct มี No ${noCount} ข้อ (${CONDUCT.filter(c=>st.cd[c.code]==='No').map(c=>c.item).join(', ')})`, pass:'Section A: Conduct' },
    { key:'C', name:`Critical Safety Items ★ (${CRIT_ITEMS.length} ข้อ)`, color:'red', rule:'PASS = ทุกข้อ ≥3 | AWARE = มีข้อได้ 2 | FAIL = มีข้อได้ 1', val: minCrit===null?'—':'ต่ำสุด '+minCrit, res:critRes,
      fail:`Critical Safety ★ มีข้อที่ได้ต่ำกว่า 3 (${CRIT_ITEMS.filter(i=>typeof st.sc[i.code]==='number'&&st.sc[i.code]<3).map(i=>i.dom+' = '+st.sc[i.code]).join(', ')})`, pass:'Critical Safety ★' },
    ...phases.map(x=>({ key:'P'+x.pi, name:PH_SHORT[x.pi], color:PH_KEY[x.pi], rule:'PASS ≥90% | AWARE 75–89% | FAIL <75%', val:(x.pct*100).toFixed(1)+'%', res:x.res,
      fail:`Phase ${x.pi+1} ได้ ${(x.pct*100).toFixed(1)}%`, pass:`Phase ${x.pi+1} (${(x.pct*100).toFixed(1)}%)` }))
  ];
  let final;
  if (isInc) final='INCOMPLETE';
  else if (parts.some(p=>p.res==='FAIL')) final='FAIL';
  else if (parts.some(p=>p.res==='AWARE / CONDITIONAL')) final='AWARE / CONDITIONAL';
  else final='PASS';
  const notPassArr = parts.filter(p=>p.res!=='PASS').map(p=>p.name);
  const notPass = isInc ? '-' : (notPassArr.length ? notPassArr.join(', ') : 'ไม่มี — ผ่านทุก Part');
  // Summary sentence
  const nxt = {1:'เกณฑ์ Visit 2: Section A มี No ได้ไม่เกิน 1 ข้อ ถ้าเกินเป็น FAIL ทันที', 2:'เกณฑ์ Visit 3: Section A ต้องไม่มี No เลย ถ้ามีแม้ 1 ข้อเป็น FAIL ทันที', 3:''}[st.visit];
  let summary;
  if (isInc) summary = 'ยังสรุปผลไม่ได้ — กรอกคะแนนและ evidence ให้ครบก่อน';
  else {
    summary = `ผลของ Visit ${st.visit} คือ ${final}.`;
    if (final==='PASS') summary += ` ผ่านครบทุก Part (คะแนนทักษะรวม ${(overall*100).toFixed(1)}%)`;
    else {
      summary += ' Part ที่ยังไม่ผ่าน: ' + parts.filter(p=>p.res!=='PASS').map(p=>p.fail+' — '+p.res).join('; ') + '.';
      const ok = parts.filter(p=>p.res==='PASS').map(p=>p.pass);
      summary += ok.length ? ' Part ที่ผ่านแล้ว: '+ok.join(', ')+'.' : ' ยังไม่มี Part ที่ผ่าน.';
      summary += ' ตามเกณฑ์ ต้องผ่านทุก Part และผลรวมจะเท่ากับผลของ Part ที่ต่ำที่สุด';
    }
    if (nxt) summary += '  |  '+nxt;
  }
  return { aw, noCount, yesCount, naCount, aRes, aRule, phases, overall, minCrit, critRes, complete, isInc, parts, final, notPass, summary };
}

const badgeCls = r => r==='PASS'?'bp':r==='FAIL'?'bf':r==='AWARE / CONDITIONAL'?'bc':'bn';
const badgeTxt = r => r==='PASS'?'✅ PASS':r==='FAIL'?'🔁 FAIL':r==='AWARE / CONDITIONAL'?'⚠️ AWARE':r==='INCOMPLETE'?'📝 INCOMPLETE':'—';
const resColor = r => r==='PASS'?'var(--green)':r==='FAIL'?'var(--red)':r==='AWARE / CONDITIONAL'?'var(--amber)':'var(--gray3)';

let R = null;
function calc(){
  if (!document.getElementById('form-body').innerHTML) return;
  R = compute(S, fv);
  // Section A
  document.getElementById('a-rule').textContent = `เกณฑ์ Visit ${S.visit}: ${R.aRule}` + (S.visit<3 ? '  (เกณฑ์เข้มขึ้นทุก Visit)' : '');
  document.getElementById('a-hdr-rule').textContent = 'Visit '+S.visit;
  document.getElementById('a-val').textContent = R.noCount+' No';
  document.getElementById('a-sub').textContent = `${R.yesCount} Yes · ${R.noCount} No · ${R.naCount} N/A`;
  setBadge('a-badge', R.aRes);
  CONDUCT.forEach(c=>{ const el=document.getElementById('cd_'+c.code); el.classList.toggle('need', S.cd[c.code]==='No' && !el.value.trim()); });
  // Phases
  R.phases.forEach(x=>{
    document.getElementById('p'+x.pi+'-val').textContent = (x.pct*100).toFixed(1)+'%';
    document.getElementById('p'+x.pi+'-sub').textContent = `Weighted ${(x.contrib*100).toFixed(1)}% / ${Math.round(x.p.w*100)}%` + (x.blank?` · ยังไม่กรอก ${x.blank} ข้อ`:'');
    const bar = document.getElementById('p'+x.pi+'-bar');
    bar.style.width = Math.min(x.pct*100,100)+'%';
    bar.style.background = x.pct>=0.9?'var(--green)':x.pct>=0.75?'var(--amber)':'var(--red)';
    setBadge('p'+x.pi+'-badge', x.res);
    x.rows.forEach(r=>{ const el=document.getElementById('ev_'+sid(r.it.code)); el.classList.toggle('need', r.num && r.s<=2 && !el.value.trim()); });
  });
  // Result
  const rc = document.getElementById('result-card');
  const map = { 'PASS':['pass','✅','PASS','ผ่านทุก Part — พร้อมปฏิบัติงานเดี่ยว'],
    'AWARE / CONDITIONAL':['cond','⚠️','AWARE / CONDITIONAL','พัฒนาเฉพาะ Part ที่ยังไม่ผ่านก่อนปฏิบัติงานเดี่ยว'],
    'FAIL':['fail','🔁','FAIL','ยังไม่พร้อมปฏิบัติงาน ต้องเทรนซ้ำใน Part ที่ไม่ผ่าน'],
    'INCOMPLETE':['inc','📝','INCOMPLETE',R.complete.replace('INCOMPLETE — ','')] };
  const [cls,ic,lb,ds] = map[R.final];
  rc.className = 'result-card '+cls;
  rc.innerHTML = `<div class="r-icon">${ic}</div><div class="r-label">${lb}</div><div class="r-desc">${esc(ds)}</div>`;
  document.getElementById('parts-box').innerHTML = R.parts.map(p=>`
    <div class="part-line"><div class="bar" style="background:var(--${p.color})"></div>
      <div><div class="pl-name">${esc(p.name)}</div><div class="pl-rule">${esc(p.rule)}</div></div>
      <div class="pl-val">${esc(p.val)}</div><div class="badge ${badgeCls(p.res)}">${p.res==='รอกรอก'?'รอกรอก':badgeTxt(p.res)}</div></div>`).join('');
  document.getElementById('overall-val').textContent = (R.overall*100).toFixed(1)+'%';
  const cv = document.getElementById('complete-val'); cv.textContent = R.complete; cv.style.color = R.isInc?'var(--red)':'var(--green)';
  document.getElementById('notpass-val').textContent = R.notPass;
  document.getElementById('sum-box').textContent = R.summary;
  renderXL();
  document.getElementById('sig-cts').textContent = fv('cts') || '(Clinical Training Specialist)';
  document.getElementById('sig-eval').textContent = fv('evaluator') || '(Evaluator)';
}
function xlValues(){
  const pct = x => (x*100).toFixed(1)+'%';
  const shortRes = R.final.replace(' / CONDITIONAL','');
  return {
    six: [
      { col:'H', lab:'Section A:\nจำนวน No', val: CONDUCT.every(c=>S.cd[c.code]) ? String(R.noCount) : '' },
      { col:'I', lab:'Critical ★:\nคะแนนต่ำสุด', val: R.critRes==='รอกรอก' ? '' : String(R.minCrit) },
      { col:'J', lab:'Phase 1 %', val: R.phases[0].blank ? '' : pct(R.phases[0].pct), copy: R.phases[0].blank ? '' : (R.phases[0].pct*100).toFixed(2)+'%' },
      { col:'K', lab:'Phase 2 %', val: R.phases[1].blank ? '' : pct(R.phases[1].pct), copy: R.phases[1].blank ? '' : (R.phases[1].pct*100).toFixed(2)+'%' },
      { col:'L', lab:'Phase 3 %', val: R.phases[2].blank ? '' : pct(R.phases[2].pct), copy: R.phases[2].blank ? '' : (R.phases[2].pct*100).toFixed(2)+'%' },
      { col:'M', lab:'ฟอร์มครบ?\n(COMPLETE)', val: R.isInc ? 'No' : 'Yes' }
    ],
    head: [ fv('date'), fv('cts'), fv('product'), fv('subproduct'), String(S.visit), fv('evaluator') ],
    result: shortRes
  };
}
function renderXL(){
  const x = xlValues();
  document.getElementById('xl-grid').innerHTML = x.six.map(c=>`<div class="xl-cell"><div class="xl-col">${c.col}</div>
    <div class="xl-lab">${esc(c.lab).replace('\n','<br>')}</div><div class="xl-val${c.val===''?' miss':''}">${c.val===''?'ยังไม่ครบ':esc(c.val)}</div></div>`).join('');
  const miss = ['วันที่','ชื่อ CTS','Product','Sub-product'].filter((l,i)=>!x.head[[0,1,2,3][i]]);
  document.getElementById('xl-extra').innerHTML =
    `<b>B–G:</b> ${esc([x.head[0]||'—', x.head[1]||'—', x.head[2]||'—', x.head[3]||'—', 'Visit '+x.head[4], x.head[5]||'—'].join(' · '))}` +
    ` &nbsp;|&nbsp; <b>N ผลจากแอป:</b> ${esc(x.result)}` +
    (miss.length ? `<br><span style="color:var(--red)">⚠ ยังไม่ได้กรอก: ${miss.join(', ')} (ต้องใช้ใน Results Log)</span>` : '');
}
function copyText(t, msg){
  const done = ()=>toast(msg);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done).catch(fallback);
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){toast('คัดลอกไม่สำเร็จ');} ta.remove(); }
}
function copyXL(mode){
  calc();
  const x = xlValues();
  const six = x.six.map(c=>c.copy!==undefined ? c.copy : c.val);
  if (mode==='six') return copyText(six.join('\t'), '📋 คัดลอก 6 ค่าแล้ว — วางที่ช่อง H ของ Results Log');
  const cond = CONDUCT.map(c=>S.cd[c.code]||'');
  const items = ALL_ITEMS.map(i=>S.sc[i.code]===undefined?'':String(S.sc[i.code]));
  const row = [...x.head, ...six, x.result, ...cond, ...items];
  copyText(row.join('\t'), '📋 คัดลอกทั้งแถวแล้ว — วางที่ช่อง B ของ Results Log');
}
function setBadge(id, r){ const el=document.getElementById(id); el.className='badge '+badgeCls(r); el.textContent = r==='รอกรอก'?'รอกรอก':badgeTxt(r); }

function copySummary(){
  const t = R ? R.summary : '';
  const done = ()=>toast('📋 คัดลอกข้อความแล้ว');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done).catch(fallback);
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){toast('คัดลอกไม่สำเร็จ');} ta.remove(); }
}

function gotoForm(visit){

function showForm(){

function resetInputs(){

function clearForm(){

// ══════════════════════════════════════════════════════════════════════
// STORAGE — localStorage (same approach as Merz Assessment)
// ══════════════════════════════════════════════════════════════════════
const DB_KEY = 'merz_cts_holistic_v1';
let activeFilter = 'all', currentRecordId = null;
function dbLoad(){ try { return JSON.parse(localStorage.getItem(DB_KEY)) || []; } catch(e){ return []; } }
function dbSave(r){ try { localStorage.setItem(DB_KEY, JSON.stringify(r)); return true; } catch(e){ toast('⚠️ บันทึกไม่ได้ในเบราว์เซอร์นี้'); return false; } }

function captureData(){
  const texts = {};
  FIELD_IDS.forEach(id=>texts[id]=fv(id));
  CONDUCT.forEach(c=>texts['cd_'+c.code]=fv('cd_'+c.code));
  ALL_ITEMS.forEach(i=>{ texts['ev_'+sid(i.code)]=fv('ev_'+sid(i.code)); texts['fb_'+sid(i.code)]=fv('fb_'+sid(i.code)); });
  const r = compute(S, id=>texts[id]||'');
  return { visit:S.visit, sc:{...S.sc}, cd:{...S.cd}, texts, result:r.final };
}
function restoreData(rec){
  S = { visit:rec.visit||1, sc:{...(rec.sc||{})}, cd:{...(rec.cd||{})} };
  resetInputs();
  Object.entries(rec.texts||{}).forEach(([id,v])=>{ const el=document.getElementById(id); if(el) el.value=v; });
  fillSubs((rec.texts||{}).subproduct);
  CONDUCT.forEach(c=>paintRow('r_'+c.code, S.cd[c.code]));
  ALL_ITEMS.forEach(i=>paintRow('r_'+sid(i.code), S.sc[i.code]));
  paintVisit(); calc();
}
function saveRecord(){
  const data = captureData();
  const cts = (data.texts.cts||'').trim();
  if (!cts){ toast('⚠️ กรุณากรอกชื่อ CTS ก่อนบันทึก'); return; }
  const records = dbLoad();
  const idx = currentRecordId ? records.findIndex(r=>r.id===currentRecordId) : -1;
  if (idx>=0){ records[idx] = { ...records[idx], ...data, updatedAt:new Date().toISOString() }; if(dbSave(records)) toast('✅ อัปเดตข้อมูลสำเร็จ'); }
  else {
    const rec = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), createdAt:new Date().toISOString(), ...data };
    records.unshift(rec); currentRecordId = rec.id;
    if (dbSave(records)) toast('✅ บันทึกข้อมูลสำเร็จ! ('+cts+' · Visit '+data.visit+')');
  }
}
function loadRecord(id){
  const rec = dbLoad().find(r=>r.id===id); if(!rec) return;
  currentRecordId = id; showForm();
  setTimeout(()=>{ restoreData(rec); toast('📂 โหลดข้อมูล: '+(rec.texts.cts||'ไม่ระบุชื่อ')+' · Visit '+rec.visit); }, 120);
}
function deleteRecord(id, evt){
  evt.stopPropagation();
  if (!confirm('ลบข้อมูลนี้?')) return;
  dbSave(dbLoad().filter(r=>r.id!==id));
  if (currentRecordId===id) currentRecordId=null;
  renderRecords(); updateStats(); toast('🗑 ลบข้อมูลแล้ว');
}
function setFilter(f){
  activeFilter = f;
  document.querySelectorAll('.sp-fpill').forEach(p=>p.classList.toggle('on', p.dataset.f===f));
  renderRecords();
}
function renderRecords(){
  const q1 = fv('search-cts').toLowerCase().trim(), q2 = fv('search-eval').toLowerCase().trim();
  let recs = dbLoad();
  if (activeFilter!=='all') recs = recs.filter(r=>String(r.visit)===activeFilter);
  recs = recs.filter(r=>{
    const t=r.texts||{};
    return (!q1 || (t.cts||'').toLowerCase().includes(q1)) &&
           (!q2 || ((t.evaluator||'')+' '+(t.clinic||'')).toLowerCase().includes(q2));
  });
  const list = document.getElementById('records-list');
  if (!recs.length){ list.innerHTML = `<div class="empty-state">ยังไม่มีข้อมูลที่บันทึก<br><small>${q1||q2?'ลองเปลี่ยนคำค้นหา':'กด "เริ่มประเมินใหม่" ด้านบน แล้วกด 💾 Save'}</small></div>`; return; }
  const grouped = {};
  recs.forEach(r=>{ const k=((r.texts&&r.texts.cts)||'— ไม่ระบุชื่อ —').trim(); (grouped[k]=grouped[k]||[]).push(r); });
  let h='';
  Object.entries(grouped).forEach(([name,rs])=>{
    rs.sort((a,b)=>a.visit-b.visit);
    h += `<div style="padding:8px 14px 4px;background:var(--gray1);font-size:10px;font-weight:700;color:var(--gray4);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--gray2)">👤 ${esc(name)}</div>`;
    rs.forEach(r=>{
      const t=r.texts||{};
      const d = t.date ? new Date(t.date+'T00:00:00').toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'}) : '';
      const res = r.result||'INCOMPLETE';
      const rb = res==='PASS'?'background:var(--green-lt);color:var(--green)':res==='FAIL'?'background:var(--red-lt);color:var(--red)':res.startsWith('AWARE')?'background:var(--amber-lt);color:var(--amber)':'background:var(--gray2);color:var(--gray4)';
      h += `<div class="record-item${r.id===currentRecordId?' active-rec':''}" onclick="loadRecord('${r.id}')">
        <div style="flex:1;min-width:0"><div class="rec-trainee">${esc(t.subproduct||t.product||t.clinic||'—')}</div>
        <div style="font-size:11px;color:var(--gray4);margin-top:2px">${esc([t.clinic,t.evaluator,d].filter(Boolean).join(' · '))}</div></div>
        <span class="rec-res" style="${rb}">${res.startsWith('AWARE')?'AWARE':res}</span>
        <span class="rec-form-badge v${r.visit}">Visit ${r.visit}</span>
        <button class="rec-del" onclick="deleteRecord('${r.id}',event)" title="ลบ">×</button></div>`;
    });
  });
  list.innerHTML = h;
}
function updateStats(){
  const all = dbLoad();
  const pass = all.filter(r=>r.result==='PASS').length;
  const notp = all.filter(r=>r.result==='FAIL'||(r.result||'').startsWith('AWARE')).length;
  document.getElementById('dash-stats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${all.length}</div><div class="stat-label">ประเมินทั้งหมด</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${pass}</div><div class="stat-label">PASS</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--red)">${notp}</div><div class="stat-label">AWARE / FAIL</div></div>`;
}

function scChip(s){ if (s===undefined) return '<span class="rp-sc sna">—</span>'; if (s==='N/A') return '<span class="rp-sc sna">N/A</span>'; return `<span class="rp-sc s${s}">${s}</span>`; }
function thDate(d){ return d ? new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }
const nl = s => esc(s||'—');

function buildReport(){
  calc();
  const r = R;
  const resCls = {'PASS':'pass','AWARE / CONDITIONAL':'cond','FAIL':'fail','INCOMPLETE':'none'}[r.final];
  const resIc = {'PASS':'✅','AWARE / CONDITIONAL':'⚠️','FAIL':'🔁','INCOMPLETE':'📝'}[r.final];
  let h = `<div class="sc-header"><div class="sc-logo-wrap"><img src="${LOGO}" alt="Merz Aesthetics" class="sc-logo"></div>
    <div class="sc-header-info"><div class="sc-form-tag">CTS Holistic Performance Evaluation · Visit ${S.visit} of 3</div>

      <div class="sc-meta-row"><div class="sc-meta-item">🧴 ${nl([fv('product'),fv('subproduct')].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' · '))}</div><div class="sc-meta-item">🏥 ${nl(fv('clinic'))}</div><div class="sc-meta-item">🧑‍🏫 ${nl(fv('evaluator'))}</div></div>
      <div class="sc-meta-row"><div class="sc-meta-item">👨‍⚕️ ${nl(fv('doctors'))}</div><div class="sc-meta-item">🎓 ${nl(fv('dlevel'))}</div></div>
      <div class="sc-pills"><div class="sc-pill lvl-std">Visit ${S.visit}</div><div class="sc-pill tch">Section A · ${esc(r.aRule)}</div></div>
    </div><div class="sc-date-badge">${thDate(fv('date'))}</div></div>
    <div class="rp-body">
    <div class="sc-result ${resCls} rp-block"><div class="sc-result-icon">${resIc}</div><div class="sc-result-label">${r.final}</div>
      <div class="sc-result-desc">Overall Competency ${(r.overall*100).toFixed(1)}% (ข้อมูลประกอบ) · Part ที่ยังไม่ผ่าน: ${esc(r.notPass)}</div></div>`;

  // Part rows with chips
  h += `<div class="sc-parts rp-block">`;
  r.parts.forEach(p=>{
    let chips = '';
    if (p.key==='A') chips = CONDUCT.map(c=>`<div class="sc-item-chip"><span style="color:var(--gray4);font-size:8px">${c.code}</span> ${esc(c.item)} <span style="color:${S.cd[c.code]==='No'?'var(--red)':S.cd[c.code]==='Yes'?'var(--green)':'var(--gray4)'}">${S.cd[c.code]||'—'}</span></div>`).join('');
    else if (p.key==='C') chips = CRIT_ITEMS.map(i=>`<div class="sc-item-chip">${esc(i.dom)} <span>${S.sc[i.code]??'—'}</span></div>`).join('');
    else { const pi=+p.key[1]; chips = PHASES[pi].items.map((i,k)=>`<div class="sc-item-chip"><span style="color:var(--gray4);font-size:8px">${k+1}${i.critical?'★':''}</span> ${esc(i.dom)} <span>${S.sc[i.code]??'—'}</span></div>`).join(''); }
    const pct = p.key.startsWith('P') ? r.phases[+p.key[1]].pct : null;
    h += `<div class="sc-part-row"><div class="sc-part-top" style="display:flex;width:100%">
        <div class="sc-part-label ${p.color}">${p.key==='A'?'Section A':p.key==='C'?'Critical ★':'Phase '+(+p.key[1]+1)}</div>
        <div class="sc-part-content"><div class="sc-part-title">${esc(p.name)} <span style="font-size:9px;color:var(--gray4);font-weight:500">${esc(p.rule)}</span></div>
          <div class="sc-prog-row">${pct!==null?`<div class="sc-prog-track"><div class="sc-prog-bar" style="width:${Math.min(pct*100,100).toFixed(1)}%;background:${resColor(p.res)}"></div></div>`:'<div style="flex:1"></div>'}
          <div class="sc-prog-val">${esc(p.val)}</div></div></div>
        <div class="sc-part-badge"><div class="sc-badge ${p.res==='PASS'?'pass':p.res==='FAIL'?'fail':p.res.startsWith('AWARE')?'cond':'na'}">${p.res==='รอกรอก'?'รอกรอก':badgeTxt(p.res)}</div></div></div>
      <div class="sc-items-row">${chips}</div></div>`;
  });
  h += `</div>`;

  h += `<div class="rp-block"><div class="rp-h navy"><span>💬 สรุปผลสำหรับแจ้ง CTS</span><span>${esc(r.complete)}</span></div><div class="rp-text">${esc(r.summary)}</div></div>`;

  h += `<div class="rp-tblock"><div class="rp-h purple"><span>Section A · Conduct &amp; Professional Behavior</span><span>${esc('Visit '+S.visit+': '+r.aRule)}</span></div>

        <td class="c">${scChip(rw.s)}</td><td class="c">${Math.round(rw.it.w*100)}%</td><td class="c">${rw.wpts!==null?(rw.wpts*100).toFixed(1)+'%':'—'}</td>

function fileBase(){ return `CTS_Eval_${(fv('cts')||'CTS').trim().replace(/\s+/g,'_')}_Visit${S.visit}`; }

function loadScript(src, globalName){
  return new Promise((res,rej)=>{
    if (window[globalName]) return res();
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load')); document.head.appendChild(s);
  });
}
// เรนเดอร์รายงานจากโคลนกว้าง 820px นอกจอ → ได้เลย์เอาต์เต็มเท่ากันทุกเครื่อง ไม่โดนตัดตามจอมือถือ
// คืน {cv, cuts}: cuts = ขอบล่างของบล็อก/แถวตาราง (พิกัด canvas) ใช้เป็นจุดตัดหน้า PDF
function captureReport(){
  return loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','html2canvas').then(()=>{
    const box=document.createElement('div'); box.style.cssText='position:fixed;left:-10000px;top:0;width:820px';
    const c=document.getElementById('summary-card').cloneNode(true); c.removeAttribute('id');
    c.style.cssText='width:820px;max-width:820px;border-radius:0;box-shadow:none';
    const a=c.querySelector('.sc-actions'); if(a) a.remove();
    c.querySelectorAll('.rp-tblock').forEach(el=>el.style.overflow='visible');
    box.appendChild(c); document.body.appendChild(box);
    const top=c.getBoundingClientRect().top, h=c.offsetHeight;
    const cutsCss=[...c.querySelectorAll('.sc-header,.sc-result,.sc-part-row,.rp-block,.rp-h,.rp-table tr')].map(el=>el.getBoundingClientRect().bottom-top);
    // ponytail: iOS Safari ทำ canvas ใหญ่เกิน ~16.7M px ไม่ได้ (ได้รูปว่าง) → ลด scale ให้พื้นที่ไม่เกิน 16M
    const scale=Math.min(2, Math.sqrt(16e6/(820*h)));
    return html2canvas(c,{scale,useCORS:true,allowTaint:true,backgroundColor:'#ffffff',logging:false,width:820,height:h,windowWidth:820})
      .then(cv=>{ box.remove(); const k=cv.height/h; return {cv, cuts:cutsCss.map(y=>Math.round(y*k))}; },
            e=>{ box.remove(); throw e; });
  });
}
function printReportPDF(){
  const portal = document.getElementById('print-summary-portal');
  toast('กำลังสร้าง PDF...');
  captureReport().then(({cv,cuts})=>{
    const pxPerPage=Math.round(cv.width*281/194);           // พื้นที่ A4 ขอบ 8mm: กว้าง 194mm สูง 281mm
    cuts=cuts.concat(cv.height).sort((a,b)=>a-b);
    const ranges=[]; let top=0;
    while(top<cv.height-1){
      let bottom=cuts.filter(c=>c>top&&c<=top+pxPerPage).pop();
      if(bottom==null) bottom=Math.min(top+pxPerPage,cv.height);   // บล็อกเดียวสูงเกินหน้า -> จำใจตัด
      ranges.push([top,bottom-top]); top=bottom;
    }
    portal.innerHTML = ranges.map(([y,h],i)=>{
      const sc=document.createElement('canvas'); sc.width=cv.width; sc.height=h;
      sc.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      const no=ranges.length>1?`<div class="print-pageno">${i+1} / ${ranges.length}</div>`:'';
      return `<div class="print-page"><img src="${sc.toDataURL('image/jpeg',0.95)}" style="width:100%;display:block">${no}</div>`;
    }).join('');
    const oldTitle = document.title; document.title = fileBase();
    toast('กำลังเปิดหน้าต่าง Print — เลือก "Save as PDF"');
    // รอรูป decode ก่อน print กันหน้าว่าง
    Promise.all([...portal.querySelectorAll('img')].map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve()))
      .then(()=>setTimeout(()=>{ window.print(); setTimeout(()=>{ portal.innerHTML=''; document.title=oldTitle; }, 2000); },150));
  }).catch(()=>toast('❌ สร้าง PDF ไม่ได้ — ตรวจสอบอินเทอร์เน็ต หรือ Screenshot แทน'));
}
function exportReportJPG(){
  toast('กำลังสร้างรูปภาพ...');
  captureReport().then(({cv})=>{
    const fname=fileBase()+'.jpg';
    cv.toBlob(async blob=>{
      if(!blob){ toast('❌ เกิดข้อผิดพลาด — ลอง Screenshot แทน'); return; }
      const file=new File([blob],fname,{type:'image/jpeg'});
      // มือถือ (iOS ไม่รองรับ a.download): เปิด share sheet → บันทึกรูป / LINE / Drive
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],title:fname}); toast('✅ บันทึก / แชร์รูปแล้ว'); return; }
        catch(err){ if(err && err.name==='AbortError') return; }
      }
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a'); link.download=fname; link.href=url; link.click();
      setTimeout(()=>URL.revokeObjectURL(url),4000); toast('✅ บันทึก JPG สำเร็จ!');
    },'image/jpeg',0.93);
  }).catch(()=>toast('❌ สร้างรูปไม่ได้ — ตรวจสอบอินเทอร์เน็ต หรือ Screenshot แทน'));
}

  merge(`A${rw}:C${rw}`,'Part',{font:F(true,10,'FFFFFF'),fill:C.blue,align:CEN});
  merge(`D${rw}:F${rw}`,'เกณฑ์ (PASS / AWARE / FAIL)',{font:F(true,10,'FFFFFF'),fill:C.blue,align:CEN});
  put(`G${rw}`,'Score',{font:F(true,10,'FFFFFF'),fill:C.blue,align:CEN}); put(`H${rw}`,'Result',{font:F(true,10,'FFFFFF'),fill:C.blue,align:CEN}); put(`I${rw}`,'หมายเหตุ',{font:F(true,10,'FFFFFF'),fill:C.blue,align:CEN});
  const minCrit = `MIN(${critCells.join(',')})`;
  const partF = [
    { col:C.A, score:fx(`COUNTIF(E${cFirst}:E${cLast},"Yes")&"/"&(${CONDUCT.length}-COUNTIF(E${cFirst}:E${cLast},"N/A"))&" Yes"`, r.parts[0].val),
      res:`IF(COUNTBLANK(E${cFirst}:E${cLast})>0,"รอกรอก",${aResF(cCount)})`, note:r.noCount>0?'บันทึกใน Conduct Log':'' },
    { col:C.crit, score:fx(`IF(COUNT(${critCells.join(',')})=0,"-","ต่ำสุด "&${minCrit})`, r.minCrit===null?'-':'ต่ำสุด '+r.minCrit),
      res:`IF(COUNT(${critCells.join(',')})<${critCells.length},"รอกรอก",IF(${minCrit}>=3,"PASS",IF(${minCrit}=2,"AWARE / CONDITIONAL","FAIL")))`, note:CRIT_ITEMS.map(i=>i.dom).join(' / ') },
    ...subs.map(([sub,pwc],i)=>({ col:C.P[i], score:fx(`${sub}/${pwc}`, r.phases[i].pct), fmt:'0.0%',
      res:`IF(COUNTBLANK(E${ranges[i][0]}:E${ranges[i][1]})>0,"รอกรอก",IF(${sub}/${pwc}>=0.9,"PASS",IF(${sub}/${pwc}>=0.75,"AWARE / CONDITIONAL","FAIL")))`, note:'' }))
  ];
  const pFirst = rw+1;
  r.parts.forEach((p,i)=>{
    rw++; const pf=partF[i];
    merge(`A${rw}:C${rw}`,`${i+1}. ${p.name}`,{font:F(true,10,'FFFFFF'),fill:pf.col[0]});
    merge(`D${rw}:F${rw}`,p.rule,{font:F(false,9),fill:pf.col[1]});
    put(`G${rw}`,pf.score,{font:F(true,10,pf.col[0]),fill:pf.col[1],align:CEN,fmt:pf.fmt});
    const [rf,rc]=resFill(p.res);
    put(`H${rw}`,fx(pf.res,p.res),{font:F(true,10,rc),fill:rf||undefined,align:CEN});
    put(`I${rw}`,pf.note,{font:F(false,9)}); ws.getRow(rw).height=30;
  });
  const pLast = rw; rw++;
  merge(`A${rw}:F${rw}`,'Overall Competency Score (ข้อมูลประกอบ ไม่ใช้ตัดสินผล)',{font:F(false,10,C.navy),fill:C.light});
  put(`G${rw}`,fx(overallCell,r.overall),{font:F(true,10,C.navy),fill:C.light,align:CEN,fmt:'0.0%'}); merge(`H${rw}:I${rw}`,'',{fill:C.light});
  rw++;
  merge(`A${rw}:F${rw}`,'Form completeness',{font:F(true)});
  merge(`G${rw}:I${rw}`,r.complete,{font:F(true,10,r.isInc?'C00000':'1E7A45')});
  const compCell=`G${rw}`; rw++;
  merge(`A${rw}:F${rw}`,'Part ที่ยังไม่ผ่าน',{font:F(true)});
  merge(`G${rw}:I${rw}`,r.notPass,{font:F(true,10,'9C0006')}); ws.getRow(rw).height=30; rw++;
  merge(`A${rw}:F${rw}`,'OVERALL VISIT RESULT (= Part ที่ต่ำที่สุด)',{font:F(true,12,'FFFFFF'),fill:C.navy});
  const pr=`H${pFirst}:H${pLast}`;
  const [ff,fc]=resFill(r.final);
  merge(`G${rw}:I${rw}`,fx(`IF(LEFT(${compCell},10)="INCOMPLETE","INCOMPLETE",IF(COUNTIF(${pr},"FAIL")>0,"FAIL",IF(COUNTIF(${pr},"AWARE / CONDITIONAL")>0,"AWARE / CONDITIONAL","PASS")))`,r.final),
    {font:F(true,13,fc),fill:ff,align:CEN}); ws.getRow(rw).height=32; rw++;
  merge(`A${rw}:B${rw+1}`,'สรุปผลสำหรับแจ้ง CTS',{font:F(true,10,C.navy),fill:C.light});
  merge(`C${rw}:I${rw+1}`,r.summary,{align:{wrapText:true,vertical:'top'}}); ws.getRow(rw).height=40; ws.getRow(rw+1).height=40; rw+=3;
  [['✅  PASS','ทุก Part ได้ PASS','→ ผ่าน พร้อมปฏิบัติงานเดี่ยว',C.pass,'D3F5DD','FFFFFF'],
   ['⚠️  AWARE / CONDITIONAL','ไม่มี Part ใด FAIL แต่มีอย่างน้อย 1 Part เป็น AWARE','→ พัฒนาเฉพาะ Part ที่ยังไม่ผ่านก่อนปฏิบัติงานเดี่ยว',C.aware,'FFF0C2','000000'],
   ['🔁  FAIL','มี Part ใด Part หนึ่งได้ FAIL','→ ยังไม่พร้อมปฏิบัติงาน ต้องเทรนซ้ำใน Part นั้น',C.fail,'FFDADA','FFFFFF']].forEach(([a,b,c,dk,lt,tc])=>{
    merge(`A${rw}:C${rw}`,a,{font:F(true,10,tc),fill:dk}); merge(`D${rw}:G${rw}`,b,{fill:lt}); merge(`H${rw}:I${rw}`,c,{fill:lt}); ws.getRow(rw).height=28; rw++;
  });

  // Section D
  rw++;
  merge(`A${rw}:I${rw}`,'SECTION D: CTS SELF-REFLECTION (CTS กรอกเองภายใน 24 ชม. หลังเทรน)',{font:F(true,11,'FFFFFF'),fill:C.navy}); ws.getRow(rw).height=26;
  [['สิ่งที่ทำได้ดีใน session นี้','ref1'],['จุดที่ติด / ยังไม่มั่นใจ','ref2'],['ครั้งหน้าจะลองทำอะไรต่างจากเดิม','ref3']].forEach(([q,id])=>{
    rw++; merge(`A${rw}:C${rw}`,q,{font:F(true)}); merge(`D${rw}:I${rw}`,fv(id),{fill:C.input}); ws.getRow(rw).height=36;
  });
  // Section E
  rw += 2;
  merge(`A${rw}:D${rw}`,'Key Strengths (จุดแข็งหลัก):',{font:F(true,10,'FFFFFF'),fill:C.blue});
  merge(`E${rw}:I${rw}`,'Development Areas & Action Plan (สิ่งที่ต้องพัฒนา + กำหนดเสร็จ):',{font:F(true,10,'FFFFFF'),fill:C.blue});
  rw++;
  merge(`A${rw}:D${rw+2}`,fv('str'),{fill:C.input,align:{wrapText:true,vertical:'top'}});
  merge(`E${rw}:I${rw+2}`,fv('dev'),{fill:C.input,align:{wrapText:true,vertical:'top'}});
  for (let k=0;k<3;k++) ws.getRow(rw+k).height=26;
  rw += 4;
  merge(`A${rw}:I${rw}`,'การลงนามของ CTS หมายถึงรับทราบผลการประเมินและได้รับสำเนาแล้ว (Acknowledgement) — ไม่จำเป็นต้องเห็นด้วยทุกข้อ หากมีความเห็นต่างให้เขียนไว้ในช่อง Feedback',{font:F(false,9,'595959',true),border:false}); ws.getRow(rw).height=28;
  rw += 2;
  [['A','C'],['D','G'],['H','I']].forEach(([a,b])=>merge(`${a}${rw}:${b}${rw}`,'_______________________________',{align:CEN,border:false}));
  rw++;
  [['A','C',fv('cts')||'(CTS name)'],['D','G',fv('evaluator')||'(Evaluator name)'],['H','I',ACTM_NAME]].forEach(([a,b,t])=>merge(`${a}${rw}:${b}${rw}`,t,{font:F(true),align:CEN,border:false}));
  rw++;
  [['A','C','(Clinical Training Specialist)  Date: ________'],['D','G','(Evaluator)  Date: ________'],['H','I','(Associate Clinical Training Manager)  Date: ________']].forEach(([a,b,t])=>merge(`${a}${rw}:${b}${rw}`,t,{align:CEN,border:false}));

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileBase()+'.xlsx';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('✅ บันทึก Excel สำเร็จ!');
}

// ─── TOAST ─────────────────────────────────────────────────────────────
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800); }

// ─── INIT ──────────────────────────────────────────────────────────────
buildForm(); paintVisit(); calc();
renderRecords(); updateStats();
</script>
